#cloud-config
# ==============================================================================
# AskPDF — Zero-Touch Cloud-Init for Oracle Cloud Always Free
# Instance Shape: VM.Standard.A1.Flex (ARM64 Ampere Altra)
# OS: Ubuntu 22.04 LTS Minimal (aarch64)
# ==============================================================================

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - tar
  - gzip
  - netfilter-persistent
  - iptables-persistent

write_files:
  - path: /opt/askpdf_init.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      
      # 1. Open OCI firewall for HTTP and HTTPS
      iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT || iptables -I INPUT -p tcp --dport 80 -j ACCEPT
      iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT || iptables -I INPUT -p tcp --dport 443 -j ACCEPT
      netfilter-persistent save || true

      # 2. Install Docker
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
      apt-get update -y
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker ubuntu || true

      # 3. Setup Project
      mkdir -p /opt/askpdf /opt/askpdf/storage /opt/askpdf/storage/data /opt/askpdf/storage/db /opt/askpdf/backups /opt/askpdf/logs
      git clone -b feature/askpdf-upgrade https://github.com/safalyareddy/askpdf.git /opt/askpdf_temp
      shopt -s dotglob
      cp -r /opt/askpdf_temp/* /opt/askpdf/
      rm -rf /opt/askpdf_temp
      chown -R ubuntu:ubuntu /opt/askpdf
      chmod +x /opt/askpdf/scripts/*.sh

      # 4. Generate systemd unit
      cat << 'EOF' > /etc/systemd/system/askpdf.service
      [Unit]
      Description=AskPDF Production Backend Stack
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/askpdf
      ExecStart=/usr/bin/docker compose up -d --build
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=600

      [Install]
      WantedBy=multi-user.target
      EOF

      systemctl daemon-reload
      systemctl enable askpdf.service

      # 5. Backup & Health cron
      (crontab -u ubuntu -l 2>/dev/null || true; echo "0 2 * * * /opt/askpdf/scripts/backup.sh >> /opt/askpdf/logs/backup.log 2>&1") | crontab -u ubuntu -
      (crontab -u ubuntu -l 2>/dev/null || true; echo "*/15 * * * * /opt/askpdf/scripts/health_check.sh >> /opt/askpdf/logs/health.log 2>&1") | crontab -u ubuntu -

runcmd:
  - /opt/askpdf_init.sh
