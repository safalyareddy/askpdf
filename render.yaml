# AskPDF — Render Blueprint Specification
# Production Docker Web Service (Render Free Tier — ₹0/month)

services:
  - type: web
    name: documind-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: STORAGE_DIR
        value: /app/storage
      - key: SUPER_USER_KEY
        value: supersecretkey
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"

