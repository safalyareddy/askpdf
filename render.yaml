# DocuMind AI — Render Blueprint Specification
# Free-tier compatible web service configuration.
# To provision a persistent disk on Render (paid add-on: $1/mo/GB), see documentation.

services:
  - type: web
    name: documind-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SUPER_USER_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: LLM_MODEL
        value: llama3
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: PDF_DIR
        value: ./data/
      - key: PERSIST_DIR
        value: ./db
