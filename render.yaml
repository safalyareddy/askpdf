# AskPDF — Render Blueprint Specification
# Production Docker Web Service (Render Free Tier — ₹0/month)

services:
  - type: web
    name: documind-ai-ddt8
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: STORAGE_DIR
        value: /app/storage
      - key: SUPER_USER_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
